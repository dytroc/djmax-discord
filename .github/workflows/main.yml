name: Release
on: [push]
permissions:
  contents: write
jobs:
  build-release:
      name: Build for ${{ matrix.os }}
      runs-on: ${{ matrix.os }}
      strategy:
        fail-fast: false
        matrix:
          include:
            - os: ubuntu-latest
              target: x86_64-unknown-linux-gnu
              artifact_name: djmax-discord-linux
              asset_name: djmax-discord-linux-amd64
            - os: windows-latest
              target: x86_64-pc-windows-msvc
              artifact_name: djmax-discord.exe
              asset_name: djmax-discord-windows-amd64.exe
            - os: macos-latest
              target: x86_64-apple-darwin
              artifact_name: djmax-discord
              asset_name: djmax-discord-macos-amd64
            - os: macos-latest
              target: aarch64-apple-darwin
              artifact_name: djmax-discord
              asset_name: djmax-discord-macos-arm64
  
      steps:
      - name: Checkout repository
        uses: actions/checkout@v4
  
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcursor-dev libxrandr-dev libxi-dev libx11-dev libgl1-mesa-dev libxext-dev libfuse2 file desktop-file-utils
  
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
  
      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
  
      - name: Build binary
        run: cargo build --release --target ${{ matrix.target }}
  
      - name: Prepare artifacts (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          mv ${{ matrix.artifact_name }} ../../../${{ matrix.asset_name }}
          cd ../../../
  
      - name: Prepare artifacts (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          mv ${{ matrix.artifact_name }} ../../../${{ matrix.asset_name }}
          cd ../../../
  
      - name: Upload binaries as release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset_name }}
          tag_name: 0.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  
